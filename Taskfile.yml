version: '3'

vars:
  APP_NAME: token-monitor-analytics
  BIN_DIR: bin
  PACKAGE_MANAGER: npm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  bootstrap:
    summary: Verifies fixed tools and installs locked frontend dependencies
    cmds:
      - powershell -NoProfile -File scripts/verify-tools.ps1
      - npm --prefix frontend ci

  generate:
    summary: Generates sqlc code and Wails bindings
    cmds:
      - sqlc generate
      - wails3 generate bindings -clean=true -ts -i

  generate:check:
    summary: Compares committed generated code without changing the worktree
    cmds:
      - powershell -NoProfile -File scripts/check-generation.ps1

  fmt:
    summary: Formats Go and frontend sources
    cmds:
      - powershell -NoProfile -File scripts/format-go.ps1
      - npm --prefix frontend run format

  fmt:check:
    summary: Checks source formatting without changing files
    cmds:
      - powershell -NoProfile -File scripts/check-go-format.ps1
      - npm --prefix frontend run format:check

  lint:
    summary: Runs Go and frontend static analysis
    cmds:
      - golangci-lint run . ./internal/... ./tests/...
      - npm --prefix frontend run typecheck
      - npm --prefix frontend run lint -- --max-warnings=0 --report-unused-disable-directives
      - powershell -NoProfile -File scripts/check-powershell.ps1

  policy:check:
    summary: Checks repository-specific architecture, traceability, design, SQL, and dependency policies
    cmds:
      - task: requirements:check
      - task: screens:check
      - go test ./tests/policy/... ./tests/traceability/...
      - powershell -NoProfile -File scripts/check-package-versions.ps1
      - powershell -NoProfile -File scripts/check-diff.ps1
      - go mod tidy -diff
      - go mod verify
      - sqlc compile
      - sqlc vet
      - sqlc diff

  security:check:
    summary: Runs blocking vulnerability and secret checks
    cmds:
      - powershell -NoProfile -File scripts/check-security.ps1

  security:advisory:
    summary: Records reviewed advisory security findings
    cmds:
      - powershell -NoProfile -File scripts/check-gosec-advisory.ps1

  test:go:
    summary: Runs application, desktop, domain, and use case tests
    cmds:
      - go test . ./internal/desktop ./internal/domain ./internal/usecase

  test:integration:
    summary: Runs file SQLite and adapter integration tests
    cmds:
      - go test ./internal/adapter/...

  test:frontend:
    summary: Runs frontend component and accessibility tests
    cmds:
      - npm --prefix frontend test

  test:e2e:
    summary: Runs browser E2E tests with the fake backend
    cmds:
      - npm --prefix frontend run test:e2e

  test:restore:
    summary: Runs restore round-trip and crash tests in temporary directories
    cmds:
      - go test ./tests/acceptance -run Restore

  test:coverage:go:
    summary: Runs all Go test layers and enforces the current handwritten-code coverage floor
    cmds:
      - powershell -NoProfile -File scripts/check-go-coverage.ps1

  test:coverage:frontend:
    summary: Runs frontend tests with line, branch, function, and statement coverage floors
    cmds:
      - powershell -NoProfile -File scripts/check-frontend-coverage.ps1

  test:coverage:
    summary: Runs the blocking Go and frontend coverage gates
    cmds:
      - task: test:coverage:go
      - task: test:coverage:frontend

  test:windows:
    summary: Runs Windows-native adapter, restore, and race tests outside CI
    cmds:
      - powershell -NoProfile -Command "if ([System.Environment]::OSVersion.Platform -ne 'Win32NT') { throw 'test:windows requires Windows' }"
      - go test -count=1 ./internal/adapter/... ./tests/acceptance
      - go test -race -count=1 ./internal/adapter/hubapi ./internal/adapter/scheduler ./internal/usecase ./internal/desktop

  test:wails:
    summary: Runs the native Wails build and NSIS package smoke check locally on Windows
    vars:
      ARCH: '{{.ARCH | default "amd64"}}'
    cmds:
      - powershell -NoProfile -Command "if ([System.Environment]::OSVersion.Platform -ne 'Win32NT') { throw 'test:wails requires Windows' }"
      - task: package
        vars:
          ARCH:
            ref: .ARCH
      - powershell -NoProfile -File scripts/check-windows-package.ps1 -Arch {{.ARCH}}

  test:stability:
    summary: Repeats shuffled concurrency-sensitive tests with the race detector outside CI
    cmds:
      - go test -race -shuffle=on -count=3 ./internal/adapter/hubapi ./internal/adapter/scheduler ./internal/usecase ./internal/desktop

  test:fuzz:
    summary: Fuzzes the backup manifest and Hub API parsers outside CI
    cmds:
      - go test -fuzz=FuzzValidateManifestKeySet -fuzztime=15s ./internal/adapter/backupzip
      - go test -fuzz=FuzzHubJSONParsers -fuzztime=15s ./internal/adapter/hubapi

  acceptance:
    summary: Runs the normative acceptance gate and writes its report
    cmds:
      - powershell -NoProfile -File scripts/check-acceptance.ps1

  acceptance:release:
    summary: Inspects normative evidence after verify without rerunning automated tests
    cmds:
      - powershell -NoProfile -File scripts/check-acceptance.ps1 -ReuseVerifiedTests

  requirements:check:
    summary: Checks that every agreed normative requirement has an owning task
    cmds:
      - powershell -NoProfile -File scripts/check-requirements.ps1

  screens:check:
    summary: Checks screen acceptance keys, owners, and referenced headings
    cmds:
      - powershell -NoProfile -File scripts/check-screens.ps1

  test:
    summary: Runs all automated test layers
    cmds:
      - task: test:coverage
      - task: test:e2e

  build:
    summary: Builds the Windows desktop application
    cmds:
      - task: windows:build

  package:
    summary: Creates the Windows NSIS installer
    vars:
      ARCH: '{{.ARCH | default "amd64"}}'
    cmds:
      - task: windows:package
        vars:
          INSTALL_SCOPE: user
          ARCH:
            ref: .ARCH

  dev:
    summary: Runs Wails development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  verify:
    summary: Runs generation, formatting, lint, tests, and Windows build
    cmds:
      - task: policy:check
      - task: generate:check
      - task: fmt:check
      - task: lint
      - task: security:check
      - task: test
      - task: build

  release:verify:
    summary: Runs the full quality suite, acceptance evidence, and local Windows package check for a release decision
    cmds:
      - task: verify
      - task: acceptance:release
      - task: test:wails
