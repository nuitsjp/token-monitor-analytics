<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Token Monitor Analytics Cloud</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}body{margin:0}.shell{max-width:1200px;margin:auto;padding:2rem}.header,.auth,.cards{display:flex;gap:1rem;align-items:center}.header{justify-content:space-between}.auth input{min-width:20rem}.auth input,button{padding:.65rem;border:1px solid #475569;border-radius:8px;background:#111827;color:#fff}.cards{margin:1.5rem 0}.card,.panel{border:1px solid #334155;border-radius:12px;background:#111c31;padding:1rem}.card{flex:1}.card span{color:#94a3b8;font-size:.8rem}.card strong{display:block;margin-top:.4rem;font-size:1.3rem}.panel{margin-top:1rem}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.7rem;border-bottom:1px solid #1e293b;font-size:.82rem}th{color:#94a3b8}.error{color:#fca5a5}.muted{color:#94a3b8}
  </style>
</head>
<body><main class="shell">
  <header class="header"><div><p class="muted">OPTIONAL CLOUD / PHASE 3</p><h1>Token Monitor Analytics</h1></div><div class="auth"><input id="secret" type="password" placeholder="Cloud shared secret" /><button id="load">表示</button></div></header>
  <p id="message" class="muted">シークレットはsessionStorageにだけ保持します。</p>
  <section class="cards"><article class="card"><span>Devices</span><strong id="devices">—</strong></article><article class="card"><span>Monthly tokens</span><strong id="tokens">—</strong></article><article class="card"><span>Monthly API value</span><strong id="cost">—</strong></article></section>
  <section class="panel"><h2>Subscriptions</h2><table><thead><tr><th>Provider</th><th>Account</th><th>Plan</th><th>Monthly USD</th></tr></thead><tbody id="subscriptions"></tbody></table></section>
  <section class="panel"><h2>Latest observations</h2><table><thead><tr><th>Observed</th><th>Provider</th><th>Window</th><th>Usage USD</th><th>Utilization</th><th>Estimated limit</th><th>Quality</th></tr></thead><tbody id="observations"></tbody></table></section>
</main><script>
const $=id=>document.getElementById(id);const usd=new Intl.NumberFormat('ja-JP',{style:'currency',currency:'USD'});const num=new Intl.NumberFormat('ja-JP');
async function load(){const secret=$('secret').value||sessionStorage.getItem('cloudSecret')||'';if(!secret){$('message').textContent='シークレットを入力してください。';$('message').className='error';return}sessionStorage.setItem('cloudSecret',secret);$('secret').value='';try{const response=await fetch('/api/v1/dashboard',{headers:{Authorization:`Bearer ${secret}`}});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();$('devices').textContent=data.deviceCount;$('tokens').textContent=num.format(data.analysis?.totalTokens||0);$('cost').textContent=usd.format(data.analysis?.totalCostUsd||0);$('subscriptions').replaceChildren(...(data.subscriptions||[]).map(item=>row([item.provider,item.accountLabel||item.accountKey,item.planName,usd.format(item.monthlyPriceUsd)])));$('observations').replaceChildren(...(data.observations||[]).slice(0,100).map(item=>row([new Date(item.observedAt).toLocaleString('ja-JP'),item.provider,item.windowLabel||item.windowKind,usd.format(item.usageUsd||0),`${(item.utilizationPercent||0).toFixed(1)}%`,item.estimatedLimitUsd?usd.format(item.estimatedLimitUsd):'—',item.calculationStatus])));$('message').textContent=`更新: ${new Date(data.generatedAt).toLocaleString('ja-JP')}`;$('message').className='muted'}catch(error){$('message').textContent=String(error);$('message').className='error'}}
function row(values){const tr=document.createElement('tr');for(const value of values){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}return tr}$('load').addEventListener('click',load);if(sessionStorage.getItem('cloudSecret'))load();
</script></body></html>
