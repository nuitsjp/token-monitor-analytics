name: Verify foundation
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    env:
      CI: 'true'
      E2E_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies and generate routes
        run: npm run setup
      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps --only-shell chromium
      - name: Verify foundation and product E2E
        run: npm run verify
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-e2e-ubuntu
          path: |
            playwright-report/
            .e2e-results/
          if-no-files-found: ignore
          retention-days: 7
