name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 18 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.7
          cache: true
      - if: matrix.language == 'go'
        run: go build ./...
      - uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b
