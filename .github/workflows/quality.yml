name: quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: 1.26.7
  NODE_VERSION: 24.19.0

jobs:
  toolchain:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install fixed toolchain
        shell: pwsh
        run: |
          npm install --global npm@11.17.0
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          python -m pip install zizmor==1.11.0
          choco install nsis --version=3.12 -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          powershell -NoProfile -Command "Install-Module PSScriptAnalyzer -Repository PSGallery -RequiredVersion 1.24.0 -Scope CurrentUser -Force"
      - run: powershell -NoProfile -File scripts/verify-tools.ps1

  policy:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install policy tools
        shell: pwsh
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          npm --prefix frontend ci
      - run: wails3 task policy:check
      - run: wails3 task generate:check

  lint:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install lint tools
        shell: pwsh
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          npm --prefix frontend ci
      - run: go mod tidy -diff
      - run: go mod verify
      - run: wails3 task fmt:check
      - run: npm --prefix frontend run build
      - run: wails3 task lint

  security:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install security tools
        shell: pwsh
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          npm --prefix frontend ci
      - name: Pull request security checks
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: wails3 task security:check
      - name: Full-history security checks
        if: github.event_name != 'pull_request'
        run: wails3 task security:check

  test:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          npm --prefix frontend ci
          npx --prefix frontend playwright install chromium
      - run: wails3 task test
        env:
          GO_COVERAGE_OUTPUT_DIRECTORY: ${{ runner.temp }}/token-monitor-go-coverage
          FRONTEND_COVERAGE_OUTPUT_DIRECTORY: ${{ runner.temp }}/token-monitor-frontend-coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-coverage-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/token-monitor-go-coverage
            ${{ runner.temp }}/token-monitor-frontend-coverage
          if-no-files-found: warn
          retention-days: 7
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-browser-diagnostics-${{ github.run_id }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
      - run: wails3 task build

  workflow-policy:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install workflow linters
        shell: pwsh
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          python -m pip install zizmor==1.11.0
      - run: actionlint
      - run: zizmor .github/workflows
