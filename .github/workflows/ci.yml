name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace with spaces
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace with spaces
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.1'
          working_directory: workspace with spaces
      - name: Install development dependencies and check runtimes
        run: mise run setup
      - name: Native Analytics, publication and TypeScript checks
        # Keep independent checks running so a failure in one matrix branch
        # does not hide the diagnostics from the other checks. mise preserves
        # the aggregate failure status for the job.
        run: mise run --continue-on-error --timeout 30m check
      - name: Native HTTP/SSE/SQLite integration
        if: ${{ !cancelled() }}
        run: mise run integration
      - name: Package Ubuntu amd64 and check extracted runtime
        if: ${{ !cancelled() }}
        run: mise run package:ubuntu:amd64
      - name: Package Ubuntu arm64 and check extracted runtime
        if: ${{ !cancelled() }}
        run: mise run package:ubuntu:arm64
