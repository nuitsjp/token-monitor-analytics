name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Go tests
        working-directory: collector
        run: go test ./...
      - name: Go vet
        working-directory: collector
        run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        working-directory: collector
        run: go test -race ./...
      - name: Node dependencies (type checker only)
        working-directory: analytics
        run: npm ci
      - name: Type checking
        working-directory: analytics
        run: npm run typecheck
      - name: Native HTTP/SQLite/SSE and core tests
        working-directory: analytics
        run: npm test
      - name: Go Collector -> native Analytics integration
        run: node --experimental-strip-types tools/integration.mjs
