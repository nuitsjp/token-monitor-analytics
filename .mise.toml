[tools]
go = "1.26.8"
node = "24.20.0"

[env]
# Keep the compiler selected by mise; do not download another Go toolchain.
GOTOOLCHAIN = "local"

[tasks.setup]
description = "Check runtimes and install the locked TypeScript development dependency"
dir = "{{config_root}}"
run = ["go version", "node --experimental-strip-types tools/check-runtime.mjs", "npm --prefix analytics ci --include=dev"]

[tasks.check]
description = "Run Go formatting/tests/vet, Analytics tests and TypeScript checks"
depends = ["check:go", "check:analytics", "typecheck"]

[tasks."check:go"]
dir = "{{config_root}}/collector"
run = ["node ../tools/check-go-format.mjs", "go test -race ./...", "go vet ./..."]
run_windows = ["node ../tools/check-go-format.mjs", "go test ./...", "go vet ./..."]

[tasks."check:analytics"]
dir = "{{config_root}}/analytics"
run = "npm test"

[tasks.typecheck]
dir = "{{config_root}}/analytics"
run = "npm run typecheck"

[tasks.integration]
dir = "{{config_root}}"
run = "node --experimental-strip-types tools/integration.mjs"

[tasks."demo:hub"]
dir = "{{config_root}}/collector"
run = "go run ./cmd/mockhub"

[tasks."demo:analytics"]
dir = "{{config_root}}/analytics"
run = "node --experimental-strip-types runtime/server.mjs --config configs/demo.json"

[tasks."demo:collector"]
dir = "{{config_root}}/collector"
env = { TMA_HUB_A_SECRET = "demo-hub-secret", TMA_INGEST_TOKEN = "demo-ingest-token-not-for-production" }
run = "go run ./cmd/collector -config configs/collector.demo.json"

[tasks."release:verify"]
description = "Prepare tools, then require all checks and integration to pass"
dir = "{{config_root}}"
run = ["mise run setup", "mise run --continue-on-error check", "mise run integration"]

[tasks."release:ubuntu:amd64"]
description = "Validate and create the Ubuntu amd64 release archive and SHA-256"
depends = ["release:verify"]
dir = "{{config_root}}"
run = "mise run package:ubuntu:amd64"

[tasks."release:ubuntu:arm64"]
description = "Validate and create the Ubuntu arm64 release archive and SHA-256"
depends = ["release:verify"]
dir = "{{config_root}}"
run = "mise run package:ubuntu:arm64"

[tasks."package:ubuntu:amd64"]
description = "Package Ubuntu amd64 only (does not certify release checks)"
dir = "{{config_root}}"
run = ["node tools/package-ubuntu.mjs amd64", "node --experimental-strip-types tools/check-package.mjs amd64"]

[tasks."package:ubuntu:arm64"]
description = "Package Ubuntu arm64 only (does not certify release checks)"
dir = "{{config_root}}"
run = ["node tools/package-ubuntu.mjs arm64", "node --experimental-strip-types tools/check-package.mjs arm64"]
