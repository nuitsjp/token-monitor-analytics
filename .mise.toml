[tools]
node = "24.20.0"

[tasks.setup]
description = "Check the fixed Node runtime and install the locked TypeScript development dependency"
dir = "{{config_root}}"
run = ["node --experimental-strip-types tools/check-runtime.mjs", "npm --prefix analytics ci --include=dev"]

[tasks.check]
description = "Run native Analytics, publication tools and TypeScript checks"
depends = ["check:analytics", "check:publication", "typecheck"]

[tasks."check:analytics"]
dir = "{{config_root}}/analytics"
run = "npm test"

[tasks.typecheck]
dir = "{{config_root}}/analytics"
run = "npm run typecheck"

[tasks.integration]
dir = "{{config_root}}"
run = ["node --experimental-strip-types tools/integration.mjs", "node --experimental-strip-types tools/integration-manage.mjs", "node --experimental-strip-types tools/integration-update.mjs"]

[tasks."demo:hub"]
dir = "{{config_root}}"
run = "node --experimental-strip-types tools/mockhub.mjs"

[tasks."demo:analytics"]
dir = "{{config_root}}/analytics"
run = "node --experimental-strip-types runtime/server.mjs --config configs/demo.json"

[tasks."release:verify"]
description = "Prepare tools, then require native checks and integration to pass"
dir = "{{config_root}}"
run = ["mise run setup", "mise run check", "mise run integration"]

[tasks."release:ubuntu:amd64"]
description = "Validate and create the Ubuntu amd64 release archive and SHA-256"
depends = ["release:verify"]
dir = "{{config_root}}"
run = "mise run package:ubuntu:amd64"

[tasks."release:ubuntu:arm64"]
description = "Validate and create the Ubuntu arm64 release archive and SHA-256"
depends = ["release:verify"]
dir = "{{config_root}}"
run = "mise run package:ubuntu:arm64"

[tasks."package:ubuntu:amd64"]
description = "Package Ubuntu amd64 only (does not certify release checks)"
dir = "{{config_root}}"
run = ["node tools/package-ubuntu.mjs amd64", "node --experimental-strip-types tools/check-package.mjs amd64"]

[tasks."package:ubuntu:arm64"]
description = "Package Ubuntu arm64 only (does not certify release checks)"
dir = "{{config_root}}"
run = ["node tools/package-ubuntu.mjs arm64", "node --experimental-strip-types tools/check-package.mjs arm64"]

[tasks."check:publication"]
dir = "{{config_root}}"
run = "node --experimental-strip-types --test tools/test/*.test.mjs"

[tasks."publish:ubuntu"]
description = "Validate and publish as the configured user without sudo (requires provision:ubuntu)"
dir = "{{config_root}}"
run = "node --experimental-strip-types tools/publish-ubuntu.mjs --apply"

[tasks."provision:ubuntu"]
description = "Administrator bootstrap: Node runtime, publication permissions and boot persistence"
dir = "{{config_root}}"
run = "node --experimental-strip-types tools/provision-ubuntu.mjs"

[tasks."configure:ubuntu"]
description = "Configure the single Analytics listener and private empty Hub Secret store"
dir = "{{config_root}}"
run = "node --experimental-strip-types tools/configure-ubuntu.mjs"

[tasks."status:ubuntu"]
description = "Read environment, single Analytics service and listener status"
dir = "{{config_root}}"
run = "node --experimental-strip-types tools/status-ubuntu.mjs"

