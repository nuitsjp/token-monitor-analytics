name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workspace with spaces
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace with spaces
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.1'
          working_directory: workspace with spaces
      - name: Install development dependencies
        run: npm ci
      - name: Validate current-value collection and display
        run: mise run check
